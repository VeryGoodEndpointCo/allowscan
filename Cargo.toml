[package]
name = "allowscan"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2.5"
rayon = "1.12"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
uuid = { version = "1", features = ["v4"] }
winsafe = { version = "0.0.29", features = ["gui", "shell"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# Lets the scan and XML output run on Linux for testing by skipping the Win32 signature calls.
linux-test = []
